[package]
name = "voice-key"
version = "0.5.14"
description = "Privacy-first push-to-talk voice input for Windows, macOS, and Linux"
authors = ["BuildWithAIs"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "voice_key_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
sha2 = "0.10"
hex = "0.4"
enigo = "0.3"
arboard = "3"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
url = "2"
futures-util = "0.3"
bytes = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
