<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/zhiruo-icon-1024.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>芷若</title>
    <script>
      // 在首帧前应用主题与强调色，避免闪烁
      try {
        var t = localStorage.getItem('vk-theme')
        if (
          t === 'dark' ||
          (t === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
        var a = localStorage.getItem('vk-accent')
        document.documentElement.setAttribute(
          'data-accent',
          a === 'gulf-blue' ||
            a === 'olive-green' ||
            a === 'lava-orange' ||
            a === 'sunset-purple' ||
            a === 'elegant-grey' ||
            a === 'classic'
            ? a
            : 'olive-green',
        )
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
